<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ladinglens</title>
  <script>
    // Apply the saved theme before the first paint so a dark page never flashes light.
    try { var t = localStorage.getItem("ladinglens-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app">
    <nav class="rail" id="rail" aria-label="Main"></nav>
    <div class="main">
      <header class="top" id="top"></header>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>
  <noscript>Ladinglens needs JavaScript to run.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
